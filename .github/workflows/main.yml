name: 🐧 Linux ExitNode - Auto 5H

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Environment Setup
        run: |
          echo "Initializing Linux environment..."
          sudo apt-get update

      - name: Enable IP Forwarding
        run: |
          echo 'net.ipv4.ip_forward = 1' | sudo tee -a /etc/sysctl.d/99-tailscale.conf
          echo 'net.ipv6.conf.all.forwarding = 1' | sudo tee -a /etc/sysctl.d/99-tailscale.conf
          sudo sysctl -p /etc/sysctl.d/99-tailscale.conf

      - name: Install and Connect Tailscale
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          echo "Installing Tailscale on Linux..."
          curl -fsSL https://tailscale.com/install.sh | sh

          echo "Connecting Tailscale..."
          sudo tailscale up --authkey "$TS_KEY" --hostname "github-runner-linux" --advertise-exit-node --accept-routes --unattended
          
          sleep 10

      - name: Keep Alive Loop
        run: |
          timeout=290
          elapsed=0
          while [ $elapsed -lt $timeout ]; do
            echo "Linux session active... ($elapsed mins)"
            sleep 60
            elapsed=$((elapsed + 1))
          done
