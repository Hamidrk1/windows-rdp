name: Linux XFCE RDP & Tailscale

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

concurrency:
  group: linux-rdp-node
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Environment
        uses: actions/cache@v4
        with:
          path: ~/.cache
          key: ${{ runner.os }}-rdp-cache-${{ hashFiles('**/*.yml') }}

      - name: Update & Install XFCE & XRDP
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xfce4 xfce4-goodies xrdp
          sudo systemctl enable xrdp

      - name: Configure XRDP Session & User
        run: |
          sudo sed -i 's/port=3389/port=3389/g' /etc/xrdp/xrdp.ini
          echo "startxfce4" > ~/.xsession
          sudo chmod +x ~/.xsession
          
          # ایجاد کاربر rwa با پسورد امن
          RDP_PASS="${{ secrets.RDP_PASSWORD }}"
          if [ -z "$RDP_PASS" ]; then
            RDP_PASS="MyPass123456!!"
          fi
          sudo useradd -m -s /bin/bash rwa || true
          echo "rwa:$RDP_PASS" | sudo chpasswd
          sudo usermod -aG sudo rwa

      - name: Start XRDP Service
        run: |
          sudo systemctl restart xrdp

      - name: Connect to Tailscale (Exit Node)
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest
          args: --advertise-exit-node --hostname=linux-rdp-node

      - name: Keep-Alive Loop
        run: |
          echo "=========================================="
          echo "Linux RDP & Tailscale Exit Node Ready!"
          echo "Username: rwa"
          tailscale ip -4
          echo "=========================================="
          
          while true; do
              sleep 300
          done
