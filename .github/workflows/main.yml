name: Linux XFCE RDP & Tailscale

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

concurrency:
  group: linux-rdp-node
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Update & Install XFCE & XRDP
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xfce4 xfce4-goodies xrdp
          sudo systemctl enable xrdp

      - name: Configure XRDP Session & User
        run: |
          echo "startxfce4" > ~/.xsession
          sudo chmod +x ~/.xsession
          
          RDP_PASS="${{ secrets.RDP_PASSWORD }}"
          if [ -z "$RDP_PASS" ]; then
            RDP_PASS="MyPass123456!!"
          fi
          sudo useradd -m -s /bin/bash rwa || true
          echo "rwa:$RDP_PASS" | sudo chpasswd
          sudo usermod -aG sudo rwa

      - name: Start XRDP Service
        run: |
          sudo systemctl restart xrdp

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest
          args: --advertise-exit-node --hostname=linux-rdp-node

      - name: Keep-Alive Loop
        run: |
          echo "Linux RDP & Tailscale Exit Node Ready!"
          while true; do
              sleep 300
          done
