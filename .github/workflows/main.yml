name: 🐧 Linux Desktop VNC + Tailscale

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Environment Setup
        run: |
          echo "Updating packages..."
          sudo apt-get update

      - name: Install Desktop Environment & VNC
        run: |
          echo "Installing XFCE Desktop and TightVNC..."
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y xfce4 xfce4-goodies tightvncserver dbus-x11
          
          # Setup VNC configuration
          mkdir -p ~/.vnc
          echo "Pass1234!" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          
          # Create startup script for XFCE
          cat << 'EOF' > ~/.vnc/xstartup
          #!/bin/bash
          xrdb $HOME/.Xresources
          startxfce4 &
          EOF
          chmod +x ~/.vnc/xstartup

          # Start VNC Server on port 5901 (:1)
          vncserver :1 -geometry 1280x720 -depth 24

      - name: Enable IP Forwarding
        run: |
          echo 'net.ipv4.ip_forward = 1' | sudo tee -a /etc/sysctl.d/99-tailscale.conf
          echo 'net.ipv6.conf.all.forwarding = 1' | sudo tee -a /etc/sysctl.d/99-tailscale.conf
          sudo sysctl -p /etc/sysctl.d/99-tailscale.conf

      - name: Install and Connect Tailscale
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          echo "Installing Tailscale..."
          curl -fsSL https://tailscale.com/install.sh | sh

          echo "Connecting Tailscale..."
          sudo tailscale up --authkey "$TS_KEY" --hostname "github-runner-linux" --advertise-exit-node --accept-routes --ssh
          
          sleep 5

      - name: Keep Alive Loop
        run: |
          timeout=290
          elapsed=0
          while [ $elapsed -lt $timeout ]; do
            echo "Desktop VNC session active... ($elapsed mins)"
            sleep 60
            elapsed=$((elapsed + 1))
          done
