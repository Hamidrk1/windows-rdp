name: 🐧 Linux Desktop (Web VNC) + Tailscale

on:
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Install Desktop & noVNC
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y xfce4 xfce4-goodies tightvncserver novnc websockify firefox
          
          mkdir -p ~/.vnc
          echo "123456" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          
          cat << 'EOF' > ~/.vnc/xstartup
          #!/bin/bash
          xrdb $HOME/.Xresources
          startxfce4 &
          EOF
          chmod +x ~/.vnc/xstartup

          vncserver :1 -geometry 1280x720 -depth 24
          
          # Run Web VNC on port 6080
          websockify --web /usr/share/novnc/ 6080 localhost:5901 &

      - name: Install and Connect Tailscale
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey "$TS_KEY" --hostname "github-runner-linux" --advertise-exit-node --accept-routes
          sleep 5

      - name: Keep Alive Loop
        run: |
          timeout=290
          elapsed=0
          while [ $elapsed -lt $timeout ]; do
            echo "Web VNC active..."
            sleep 60
            elapsed=$((elapsed + 1))
          done
